name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders let the build run with no secrets. The app reports itself as
      # "not configured" with these values.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The secret scan reads the full history.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:lint
      - run: npm run secrets:scan
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: npm run test:e2e

  hosted:
    name: Hosted integration and E2E
    # Opt-in, because this uses the shared free-plan project and its auth rate limit.
    # To enable it, add the SUPABASE_TEST_URL and SUPABASE_TEST_PUBLISHABLE_KEY
    # secrets and set the repository variable RUN_HOSTED_TESTS=true.
    if: ${{ vars.RUN_HOSTED_TESTS == 'true' && github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
