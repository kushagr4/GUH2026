name: Review status

# Shows a "Human review" status on each PR: pending until someone other than the
# author approves the latest commit, red if changes were requested.
#
# ADVISORY. This repo's GitHub plan can't require reviews, so nothing stops a
# merge without approval; this only makes the state visible. The rule is the
# team's: one approval from someone else before merging. docs/ci-and-reviews.md

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Report review status
    # A pull request from a fork gets a read-only token, which can't write a status.
    if: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the status script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/review-status.mjs
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Post the Human review status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/review-status.mjs
